name: freshsense CI

# Scoped to the freshsense/ subtree so it does not fire on changes to the
# backend/, frontend/ or nginx/ services, which have their own lifecycle.
on:
  push:
    branches: [main]
    paths: ['freshsense/**', '.github/workflows/freshsense-ci.yml']
  pull_request:
    paths: ['freshsense/**', '.github/workflows/freshsense-ci.yml']
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    working-directory: freshsense

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch — the GPU wheels are 2.5 GB and CI has no GPU)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
              "torch>=2.2" "torchvision>=0.17"
          pip install -e ".[dev,llm]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        # `not slow` skips the tests that need the real checkpoint and dataset,
        # neither of which is in the repo. Everything else is hermetic: no
        # network, no weights, no API key.
        run: pytest -m "not slow" --cov=freshsense --cov-report=xml --cov-report=term

      - name: Enforce the coverage floor
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print(f"line coverage: {rate:.1%}")
          if rate < 0.80:
              sys.exit(f"coverage {rate:.1%} is below the 80% floor")
          PY

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        working-directory: .
        run: docker build -t freshsense:ci freshsense
      - name: Smoke-test the container
        run: |
          docker run -d --name freshsense -p 8000:8000 freshsense:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/healthz; then break; fi
            sleep 2
          done
          curl -fs http://localhost:8000/healthz | grep '"status":"ok"'
          docker logs freshsense
          docker rm -f freshsense
