[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freshsense"
version = "0.1.0"
description = "AI-native food spoilage triage: a ViT classifier wrapped in a grounded, guard-railed agent service."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
freshsense = "freshsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: needs the real ViT checkpoint or network"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults. `Depends(...)`, `File(...)` and
# `Form(...)` in defaults is how FastAPI declares dependencies and request parts —
# hoisting them out would break the framework, not improve the code.
"src/freshsense/api/app.py" = ["B008"]
