server {
    listen 80;
    server_name _; 

    # Log formats and locations
    access_log /var/log/nginx/foodai-access.log;
    error_log /var/log/nginx/foodai-error.log;

    # Limit uploading payload size to 15MB (backend limits to 10MB, so buffer is given here)
    client_max_body_size 15M;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (often useful for FastApi / dev setups)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Optional: Caching static files (CSS/JS) to take load off FastAPI
    location /static/ {
        proxy_pass http://app:8000/static/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
